<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafbf7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#17251f" media="(prefers-color-scheme: dark)"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>캠핑 노트</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="static/hub.css"><script defer src="static/hub.js"></script></head><body data-hub="ledger"><header id="hubHeader" hidden><nav aria-label="캠핑 앱 전환"><button id="journalTab" type="button" aria-pressed="true">캠핑장 기록</button><button id="ledgerTab" type="button" aria-pressed="false">캠핑 장부</button></nav><div class="hub-actions"><button id="hubInstall" type="button" hidden>캠핑 노트 설치·연결</button><button id="hubPlatformSync" type="button" hidden disabled>예약 동기화</button><button id="hubSettings" type="button" disabled aria-label="캠핑장 기록 설정 열기">⚙ 설정</button></div></header><main><iframe id="journalFrame" title="캠핑장 기록"></iframe><iframe id="ledgerFrame" title="캠핑 장부" hidden></iframe><section id="connectLedger" hidden><h1>캠핑 노트 연결</h1><p>홈어시스턴트 상단의 캠핑 노트 설치·연결에서 만든 연결키를 입력해주세요. 한 번 연결하면 기록과 장부를 함께 사용합니다.</p><form id="ledgerKeyForm"><label for="ledgerKey">캠핑 노트 기기 연결키</label><input id="ledgerKey" type="password" autocomplete="off" maxlength="100" required><button id="connectLedgerButton" type="submit">캠핑 노트 연결</button></form><p id="hubStatus" role="status"></p><p class="hint">기존 기록·장부 연결키도 사용할 수 있습니다. 연결키는 브라우저 저장소에 저장하지 않습니다.</p></section></main></body></html>
