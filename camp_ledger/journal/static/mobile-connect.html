<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#234e43"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="static/icons/icon-192.png"><link rel="stylesheet" href="static/style.css"><script defer src="static/connect.js"></script><title>캠핑 노트 연결</title></head><body><main style="max-width:500px;padding-top:80px"><div class="brand"><span class="brand-icon">△</span><h1>캠핑 노트</h1></div><h2>내 기기를 연결하세요.</h2><p class="hint">QR이나 연결 버튼으로 열면 자동으로 연결됩니다. 직접 연결할 때만 아래에 연결키를 입력하세요.</p><p id="connectStatus" role="status"></p><div id="quickConnectActions" hidden><a id="connectApp" class="button primary">캠핑 노트 앱으로 연결</a><button id="connectBrowser" type="button">브라우저에서 연결</button><p class="hint">앱이 열리지 않으면 위 버튼을 눌러주세요. 앱 설치 전이라면 브라우저로 먼저 연결할 수 있습니다.</p></div><form id="connectForm"><label>기기 연결키<input id="key" type="password" required autocomplete="off"></label><button class="primary" style="margin-top:20px">연결하기</button></form><h3>아이폰 설치 방법</h3><p class="hint">연결한 뒤 Safari의 공유 → 홈 화면에 추가 → 추가를 누르세요. 홈 화면 아이콘으로 이 기록을 바로 열 수 있습니다.</p></main></body></html>
