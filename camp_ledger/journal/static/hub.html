<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#234e43"><title>캠핑 노트</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="static/hub.css"><script defer src="static/hub.js"></script></head><body><header><nav aria-label="캠핑 앱 전환"><button id="journalTab" type="button" aria-pressed="true">캠핑장 기록</button><button id="ledgerTab" type="button" aria-pressed="false">캠핑 장부</button></nav><button id="ledgerConnection" type="button">장부 연결</button></header><main><iframe id="journalFrame" title="캠핑장 기록" src="./?camp_hub=1"></iframe><iframe id="ledgerFrame" title="캠핑 장부" hidden></iframe><section id="connectLedger" hidden><h1>캠핑 장부 연결</h1><p>기존 장부 애드온의 ‘앱 설치·연결’에서 기기 연결키를 만들고 아래에 한 번 입력해주세요. 연결 후에는 위 버튼으로 두 화면을 오갈 수 있습니다.</p><form id="ledgerKeyForm"><label for="ledgerKey">장부 기기 연결키</label><input id="ledgerKey" type="password" autocomplete="off" maxlength="100" required><button id="connectLedgerButton" type="submit">장부 연결</button></form><p id="hubStatus" role="status"></p><p class="hint">캠핑장 기록 연결키와 장부 연결키는 서로 다릅니다. 연결키는 이 화면에서 장부 서버로만 전송하며 브라우저 저장소에는 저장하지 않습니다.</p></section></main></body></html>
